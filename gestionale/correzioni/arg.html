</style></head><body><div id="w"></div><script>
const P='ph/arg/';
function gen(S,k,key){ const N=S.length, s=S[k], sid=key+(k+1), t=s.type||'photo';
  const bars='<div class="bars">'+S.map((_,i)=>`<i class="${i===k?'on':''}"></i>`).join('')+'</div>';
  const top=`<div class="top"><img src="icon.png"><span class="n">${String(k+1).padStart(2,'0')} / ${String(N).padStart(2,'0')}</span></div>`;
  const nxt=k<N-1?'<div class="next">AVANTI →</div>':'<div class="next" style="color:inherit;opacity:.7">matteoscainelli.it</div>';
  const src=s.src?`<div class="srcl">${s.src}</div>`:'';
  if(t==='photo'){ const chips=(s.chips||[]).map(c=>`<span>${c}</span>`).join('');
    return `<div class="s ${s.cov?'cov':''} ${s.src?'has-src':''} ${s.raw?'raw':''} ${s.os?'os':''}" id="${sid}"><div class="ph" style="background-image:url(${P}${s.ph});background-position:${s.pos||'center'};${s.phh?'height:'+s.phh+'px':''}"></div>
<div class="panel"></div><div class="grid"></div>${top}<div class="tag ${s.dk?'dk':''}">${s.tag}</div>
<div class="txt"><h1${s.hs?` style="font-size:${s.hs}px"`:''}>${s.h}</h1><p class="p">${s.p}</p>${chips?`<div class="chips">${chips}</div>`:''}</div>${src}${bars}${nxt}<div class="grain"></div></div>`; }
  if(t==='tips'){ const tips=(s.tips||[]).map(x=>`<div class="tip"><div class="k">${x[0]}</div><div><b>${x[1]}</b><span>${x[2]}</span></div></div>`).join('');
    return `<div class="s nt" id="${sid}"><div class="nt-ph" style="background-image:url(${P}${s.ph});background-position:${s.pos||'center 40%'}"></div><div class="nt-sh"></div><div class="grid2"></div>${top}
<div class="nt-box"><div><span class="tag" style="position:static;display:inline-block;transform:none">${s.tag}</span></div><h1>${s.h}</h1>${s.p?`<p class="p">${s.p}</p>`:''}<div class="tips">${tips}</div>${s.src?`<div class="src2">${s.src}</div>`:''}</div>
${bars}${nxt}<div class="grain"></div></div>`; }
  if(t==='week'){ const d=(s.days||[]).map(x=>`<div class="d"><i>${x[0]}</i><div><b>${x[1]}</b><span>${x[2]}</span></div></div>`).join('');
    return `<div class="s cp" id="${sid}"><div class="cp-ph" style="background-image:url(${P}${s.ph});height:620px;background-position:${s.pos||'center'}"></div><div class="cp-sh" style="background:linear-gradient(180deg,rgba(20,20,19,.3) 0,rgba(20,20,19,.2) 250px,rgba(20,20,19,.9) 500px,#141413 620px)"></div><div class="grid2"></div>${top}
<div class="txt" style="top:430px;bottom:auto"><span class="tag" style="position:static;display:inline-block;transform:none">${s.tag}</span><h1 style="margin-top:26px">${s.h}</h1><div class="wk">${d}</div><p class="p" style="margin-top:26px;font-size:30px">${s.p}</p><div class="cta2">${s.cta}</div></div>
${bars}${nxt}<div class="grain"></div></div>`; }
  if(t==='end'){ const strip=(s.strip||[]).map(([p,pos])=>`<div style="background-image:url(${P}${p});background-position:${pos}"></div>`).join('');
    return `<div class="s end ${s.os?'os':''}" id="${sid}"><div class="grid2"></div>${s.rawTop?`<div class="rawtop" style="background-image:url(${P}${s.rawTop})"></div>`:top+`<div class="strip">${strip}</div>`}
<div class="txt"><h1 style="font-size:${s.hs||130}px">${s.h}</h1><p class="p">${s.p}</p><div class="cta">${s.cta}</div><div class="who"><b>Matteo Scainelli</b>${s.who}</div></div>${bars}${nxt}<div class="grain"></div></div>`; }
  return '';
}


function LAYOUT(){ document.querySelectorAll('.s').forEach(s=>{
  const ph=s.querySelector('.ph'), pa=s.querySelector('.panel'), gr=s.querySelector('.grid'), tg=s.querySelector(':scope>.tag'), tx=s.querySelector('.txt');
  if(!ph||!pa||!tx) return;
  const T=tx.offsetTop; let P=Math.max(640,Math.min(s.classList.contains('raw')?930:1160,T-190)); const H=1920-P;
  pa.style.height=H+'px'; if(gr) gr.style.height=H+'px'; ph.style.height=(P+170)+'px'; if(tg) tg.style.top=(P+22)+'px';
});
  document.querySelectorAll('.s.cp').forEach(s=>{ const tx=s.querySelector('.txt'), ph=s.querySelector('.cp-ph'), sh=s.querySelector('.cp-sh'); if(!tx||!ph) return;
    const H=Math.max(620,tx.offsetTop+180); ph.style.height=H+'px'; if(sh) sh.style.background=`linear-gradient(180deg,rgba(20,20,19,.3) 0,rgba(20,20,19,.15) 260px,rgba(20,20,19,.85) ${H-160}px,#141413 ${H}px)`; });
  document.querySelectorAll('.s.nt').forEach(s=>{ const b=s.querySelector('.nt-box'), ph=s.querySelector('.nt-ph'), sh=s.querySelector('.nt-sh'); if(!b||!ph) return;
    const T=b.offsetTop+b.firstElementChild.offsetTop, H=Math.max(700,T+120); ph.style.height=H+'px'; if(sh){ sh.style.height=(H+20)+'px'; sh.style.background=`linear-gradient(180deg,rgba(20,20,19,.35) 0,rgba(20,20,19,0) 300px,rgba(20,20,19,.25) ${H-220}px,#141413 ${H}px)`; } });
  document.querySelectorAll('.s.end').forEach(s=>{ const tx=s.querySelector('.txt'), st=s.querySelector('.strip'); if(!tx||!st) return;
    const H=Math.max(380,tx.offsetTop-90-st.offsetTop); st.querySelectorAll('div').forEach(d=>d.style.height=H+'px'); });
 document.body.dataset.ok=1; }

/* anteprima correzioni: riceve la serie dal gestionale (stessa origine) e disegna una slide 1080x1920 scalata */
const W=document.getElementById('w');
function fit(){ const sc=Math.min(innerWidth/1080, innerHeight/1920)||0.3; W.style.transform=`scale(${sc})`; W.style.left=Math.max(0,(innerWidth-1080*sc)/2)+'px'; }
addEventListener('resize',fit); fit();
let seq=0;
async function draw(m){ const my=++seq; W.innerHTML=gen(m.ser,m.k,m.key||'s');
  try{ await document.fonts.ready; }catch(_){ }
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  if(my!==seq) return; try{ LAYOUT(); }catch(e){ console.warn(e); } fit();
  try{ parent.postMessage({ms:'corr-done'},location.origin); }catch(_){ } }
addEventListener('message',e=>{ if(e.origin!==location.origin) return; const m=e.data; if(m&&m.ms==='corr'&&Array.isArray(m.ser)) draw(m); });
window.CORR_DRAW=draw;
/* 20/11/2026: immagine finale 1080x1920 della slide disegnata (per «Usa questa grafica» e «Scarica PNG») */
let H2I=null; function h2i(){ if(window.htmlToImage) return Promise.resolve(window.htmlToImage); if(H2I) return H2I;
  H2I=new Promise((ok,ko)=>{ const sc=document.createElement('script'); sc.src='h2i.js?v=1'; sc.onload=()=>ok(window.htmlToImage); sc.onerror=()=>{ H2I=null; ko(new Error('libreria immagine non caricata')); }; document.head.appendChild(sc); }); return H2I; }
window.CORR_PNG=async function(type,q){ const lib=await h2i(); const el=W.querySelector('.s'); if(!el) throw new Error('nessuna slide');
  try{ await document.fonts.ready; }catch(_){ }
  const o={width:1080,height:1920,pixelRatio:1,canvasWidth:1080,canvasHeight:1920,style:{margin:'0'}};
  await lib.toCanvas(el,o).catch(()=>null); /* Safari: il primo giro a volte perde foto e font */
  const cv=await lib.toCanvas(el,o);
  return await new Promise(r=>cv.toBlob(r,type||'image/png',q)); };
